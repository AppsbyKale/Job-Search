[versions]
agp = "9.3.2"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
navigationCompose = "2.9.8"
room = "2.8.4"
datastore = "1.2.1"
securityCrypto = "1.1.0"
jsoup = "1.23.1"
pdfbox = "2.0.27.0"
litertlm = "0.16.1"
